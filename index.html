<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhamad Soran Ali</title>
<meta name="description" content="Muhamad Soran Ali — CAD/CAM & Automation Specialist">
<link rel="icon" href="assets/photo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a40; --navy-2:#13344f; --teal:#14a0a0; --teal-2:#1bc4b8; --teal-soft:#d9f2f0;
  --bg:#f4f7fa; --surface:#ffffff; --surface-2:#eef3f7; --text:#11243a; --muted:#5b6b7d; --line:#dbe3ea;
  --shadow:0 20px 50px -20px rgba(15,42,64,.25);
  --grid:rgba(15,42,64,.06);
  --radius:22px;
  --font-latin:'Outfit',system-ui,sans-serif;
  --font-arabic:'Vazirmatn','Noto Sans Arabic',system-ui,sans-serif;
  --font-head-arabic:'Noto Kufi Arabic','Vazirmatn',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1724; --surface:#10233a; --surface-2:#142c46; --text:#e7eef5; --muted:#9fb1c3; --line:#1f3a56;
    --teal-soft:rgba(27,196,184,.12); --shadow:0 20px 50px -20px rgba(0,0,0,.6); --grid:rgba(27,196,184,.06);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1724; --surface:#10233a; --surface-2:#142c46; --text:#e7eef5; --muted:#9fb1c3; --line:#1f3a56;
  --teal-soft:rgba(27,196,184,.12); --shadow:0 20px 50px -20px rgba(0,0,0,.6); --grid:rgba(27,196,184,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-arabic); background:var(--bg); color:var(--text); line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px; overflow-x:hidden; transition:background-color .3s,color .3s;
}
html[lang="en"] body{font-family:var(--font-latin);line-height:1.65}
h1,h2,h3{font-family:var(--font-head-arabic);line-height:1.3}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{font-family:var(--font-latin)}
a{color:inherit;text-decoration:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- NAV ---------- */
.nav{position:fixed;inset-inline:0;top:0;z-index:50;transition:.3s}
.nav.scrolled{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);box-shadow:0 6px 30px -18px rgba(0,0,0,.4)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:74px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-family:var(--font-latin);letter-spacing:.5px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--teal));display:grid;place-items:center;color:#fff;font-size:15px}
.menu{display:flex;gap:4px;list-style:none}
.menu a{padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px;color:var(--muted);transition:.2s}
.menu a:hover,.menu a.active{color:var(--teal);background:var(--teal-soft)}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--font-arabic);padding:7px 12px;border-radius:999px;cursor:pointer;transition:.2s}
.lang button[data-l="en"]{font-family:var(--font-latin)}
.lang button.on{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:hover{color:var(--teal);transform:rotate(15deg)}
.icon-btn svg{width:19px;height:19px}
.burger{display:none}

/* ---------- HERO ---------- */
.hero{position:relative;min-height:min(100vh,940px);display:flex;align-items:center;padding:120px 0 70px;overflow:hidden}
.hero::before{content:"";position:absolute;inset-inline-start:-10%;top:-30%;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(20,160,160,.22),transparent 65%);filter:blur(10px)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:14px;margin-bottom:22px}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(20,160,160,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(20,160,160,0)}100%{box-shadow:0 0 0 0 rgba(20,160,160,0)}}
.hero h1{font-size:clamp(42px,6.4vw,82px);font-weight:900;letter-spacing:-1px;line-height:1.08}
html[lang="en"] .hero h1{text-transform:uppercase;letter-spacing:-2px}
.hero h1 .l2{display:block;background:linear-gradient(90deg,var(--teal),var(--teal-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{margin-top:18px;font-size:clamp(15px,1.6vw,19px);font-weight:600;color:var(--muted);letter-spacing:1px}
html[lang="en"] .role{letter-spacing:4px;text-transform:uppercase}
.role-bar{width:80px;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--teal-2));margin:22px 0}
.motto{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.motto span{padding:6px 14px;border:1px dashed var(--teal);border-radius:10px;font-size:14px;font-weight:600;color:var(--teal)}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:14px;font-weight:700;font-size:15px;transition:.25s;cursor:pointer;border:0;font-family:inherit}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;box-shadow:0 14px 30px -12px rgba(20,160,160,.7)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 34px -12px rgba(20,160,160,.8)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-3px)}

.photo-box{position:relative;justify-self:center;width:min(380px,100%)}
.photo-frame{position:relative;border-radius:32px;overflow:hidden;aspect-ratio:310/345;box-shadow:var(--shadow);border:6px solid var(--surface);z-index:2;transform:rotate(-2deg);transition:.5s}
.photo-box:hover .photo-frame{transform:rotate(0)}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
.photo-box::before{content:"";position:absolute;inset:-18px;border-radius:40px;background:linear-gradient(135deg,var(--navy),var(--teal));transform:rotate(4deg);z-index:1;opacity:.95}
.gear{position:absolute;z-index:3;color:var(--teal);animation:spin 18s linear infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.gear.g1{width:86px;height:86px;inset-inline-end:-34px;top:-30px}
.gear.g2{width:54px;height:54px;inset-inline-end:34px;top:-48px;animation-direction:reverse;animation-duration:12s;color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{position:absolute;z-index:4;background:var(--surface);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;animation:float 5s ease-in-out infinite}
.badge b{font-size:22px;font-family:var(--font-latin);color:var(--teal);line-height:1}
.badge small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.badge .bi{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.badge .bi svg{width:20px;height:20px}
.badge.b1{inset-inline-start:-46px;bottom:60px}
.badge.b2{inset-inline-end:-30px;bottom:-26px;animation-delay:1.5s}
@keyframes float{50%{transform:translateY(-10px)}}

/* ---------- STATS ---------- */
.stats{margin-top:-10px;position:relative;z-index:5}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:var(--radius);padding:30px;color:#fff;box-shadow:var(--shadow);overflow:hidden;position:relative}
.stats-grid::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:30px solid rgba(27,196,184,.15)}
.stat{text-align:center;padding:6px 10px;border-inline-end:1px solid rgba(255,255,255,.12)}
.stat:last-child{border:0}
.stat .num{font:800 clamp(30px,4vw,44px) var(--font-latin);color:var(--teal-2);line-height:1.1}
.stat .lbl{font-size:14px;opacity:.85}

/* ---------- SECTIONS ---------- */
section.block{padding:100px 0}
.sec-head{display:flex;align-items:center;gap:18px;margin-bottom:46px}
.sec-icon{width:62px;height:62px;flex:none;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px var(--teal-soft)}
.sec-icon svg{width:28px;height:28px}
.sec-head h2{font-size:clamp(26px,3.4vw,38px);font-weight:800}
html[lang="en"] .sec-head h2{text-transform:uppercase;letter-spacing:1px}
.sec-head .ln{flex:1;height:2px;background:linear-gradient(90deg,var(--teal),transparent)}
[dir="rtl"] .sec-head .ln{background:linear-gradient(-90deg,var(--teal),transparent)}
.sec-num{font:800 14px var(--font-latin);color:var(--teal);opacity:.8}

/* about */
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:34px;box-shadow:var(--shadow)}
.about-text{font-size:clamp(17px,1.6vw,20px);color:var(--text)}
html[lang="en"] .about-text::first-letter{font-size:1.6em;color:var(--teal);font-weight:800}
.quote{position:relative;background:linear-gradient(160deg,var(--navy),#0b1f31);color:#fff;border:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.quote .qm{font:900 120px/0.6 Georgia,serif;color:var(--teal-2);opacity:.6;margin-bottom:10px}
.quote p{font-size:22px;font-style:italic;font-weight:300}
html:not([lang="en"]) .quote p{font-style:normal;font-weight:500}
.quote .bar{width:60px;height:4px;background:var(--teal-2);border-radius:4px;margin-top:20px}
.quote svg.mount{position:absolute;inset-inline:0;bottom:0;width:100%;opacity:.18}
.traits{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.traits span{padding:7px 14px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:14px}

/* experience */
.timeline{position:relative;padding-inline-start:44px}
.timeline::before{content:"";position:absolute;inset-inline-start:13px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--teal),var(--navy))}
.job{position:relative;margin-bottom:24px}
.job::before{content:"";position:absolute;inset-inline-start:-40px;top:30px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:5px solid var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}
.job .card{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 30px;transition:.3s}
.job .card:hover{transform:translateX(6px);border-color:var(--teal)}
[dir="rtl"] .job .card:hover{transform:translateX(-6px)}
.job h3{font-size:clamp(18px,2vw,22px);font-weight:700;color:var(--text)}
.job p{color:var(--muted);font-size:15px}
.dur{flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--text);white-space:nowrap}
.dur svg{width:17px;height:17px;color:var(--teal)}
.now{display:inline-block;margin-inline-start:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--teal);color:#fff;vertical-align:middle}
.job.current::before{background:var(--teal);animation:pulse 2s infinite}

/* skills */
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.skills-grid h3{font-size:20px;margin-bottom:22px;display:flex;align-items:center;gap:10px}
.skills-grid h3 i{width:10px;height:10px;border-radius:3px;background:var(--teal);transform:rotate(45deg)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;font-weight:600;font-size:15px;transition:.25s}
.chip:hover{border-color:var(--teal);background:var(--teal-soft);transform:translateY(-3px)}
.chip .ci{width:34px;height:34px;flex:none;border-radius:10px;background:var(--surface);color:var(--teal);display:grid;place-items:center;box-shadow:0 4px 10px -4px rgba(0,0,0,.15)}
.chip .ci svg{width:18px;height:18px}

/* education */
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.edu{position:relative;overflow:hidden}
.edu .big-ic{position:absolute;inset-inline-end:-20px;bottom:-30px;width:170px;height:170px;color:var(--teal);opacity:.08}
.edu .tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:6px 14px;border-radius:999px;margin-bottom:18px}
.edu .tag svg{width:16px;height:16px}
.edu h3{font-size:22px;margin-bottom:6px}
.edu p{color:var(--muted)}
.edu .yr{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-family:var(--font-latin)}
.edu .yr svg{width:18px;height:18px;color:var(--teal)}

/* contact */
.contact{background:linear-gradient(135deg,var(--navy),#0b1f31);color:#fff;border-radius:32px;padding:60px;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:30px 30px}
.contact-in{position:relative;display:grid;grid-template-columns:1fr 1.3fr;gap:50px;align-items:center}
.contact h2{font-size:clamp(28px,3.6vw,42px);font-weight:800;margin-bottom:14px}
.contact h2 em{font-style:normal;color:var(--teal-2)}
.contact .lead{opacity:.8;margin-bottom:28px}
.c-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.c-item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:.25s;min-width:0}
a.c-item:hover{background:rgba(27,196,184,.18);border-color:var(--teal-2);transform:translateY(-3px)}
.c-item .ci{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--teal-2);display:grid;place-items:center;color:var(--teal-2)}
.c-item .ci svg{width:20px;height:20px}
.c-item small{display:block;font-size:12px;opacity:.65}
.c-item b{font-weight:600;font-size:15px;word-break:break-all}
.c-item.wide{grid-column:span 2}

footer{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
footer .bars{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
footer .bars i{height:5px;width:120px;border-radius:5px;background:var(--navy)}
footer .bars i+i{width:60px;background:var(--teal)}

.to-top{position:fixed;inset-inline-end:22px;bottom:22px;z-index:40;opacity:0;pointer-events:none;transition:.3s;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border:0}
.to-top.show{opacity:1;pointer-events:auto}

/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
.fade-lang{animation:fl .45s ease}
@keyframes fl{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- RESPONSIVE ---------- */
@media (max-width:980px){
  .menu{position:fixed;top:74px;inset-inline:16px;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);transform:translateY(-12px);opacity:0;pointer-events:none;transition:.25s}
  .menu.open{transform:none;opacity:1;pointer-events:auto}
  .burger{display:grid}
  .hero-grid,.about-grid,.skills-grid,.edu-grid,.contact-in{grid-template-columns:1fr}
  .hero-grid{gap:70px}
  .photo-box{order:-1;width:min(300px,78%)}
  .hero{text-align:center}
  .hero .role-bar{margin-inline:auto}
  .motto,.cta{justify-content:center}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:20px}
  .stat:nth-child(2){border:0}
  .contact{padding:40px 26px}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .brand span{display:none}
  .lang button{padding:7px 9px}
  section.block{padding:70px 0}
  .badge.b1{inset-inline-start:-20px;bottom:30px}
  .badge.b2{inset-inline-end:-14px}
  .gear.g1{inset-inline-end:-14px}
  .job .card{flex-direction:column;align-items:flex-start}
  .chips,.c-list{grid-template-columns:1fr}
  .c-item.wide{grid-column:auto}
  .card{padding:24px}
  .timeline{padding-inline-start:36px}
  .job::before{inset-inline-start:-32px}
  .timeline::before{inset-inline-start:9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media print{
  .nav,.to-top,.cta,.gear{display:none!important}
  body{background:#fff}
  .rv{opacity:1;transform:none}
  section.block{padding:30px 0}
  .hero{min-height:auto;padding:20px 0}
}
</style>
</head>

const root = document.documentElement;
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

function setLang(l){
  if(!T[l]) l = "ckb";
  const d = T[l];
  root.lang = l; root.dir = d.dir;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v = d[el.dataset.i];
    if(v !== undefined) el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.l === l));
  document.title = d.fullName + " — CV";
  const c = document.getElementById("content");
  c.classList.remove("fade-lang"); void c.offsetWidth; c.classList.add("fade-lang");
  store.set("cv-lang", l);
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
const qp = new URLSearchParams(location.search).get("lang");
setLang(qp || store.get("cv-lang") || "ckb");

// theme
const themeBtn = document.getElementById("themeBtn");
function isDark(){ return root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function paintThemeIcon(){ themeBtn.querySelector("use").setAttribute("href", isDark() ? "#i-sun" : "#i-moon"); }
const savedTheme = store.get("cv-theme"); if(savedTheme) root.dataset.theme = savedTheme;
paintThemeIcon();
themeBtn.addEventListener("click",()=>{ root.dataset.theme = isDark() ? "light" : "dark"; store.set("cv-theme", root.dataset.theme); paintThemeIcon(); });

// nav
const nav = document.getElementById("nav"), toTop = document.getElementById("toTop"), menu = document.getElementById("menu");
document.getElementById("burger").addEventListener("click",()=>menu.classList.toggle("open"));
menu.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>menu.classList.remove("open")));
toTop.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
const links = [...menu.querySelectorAll("a")];
addEventListener("scroll",()=>{
  const y = scrollY;
  nav.classList.toggle("scrolled", y > 30);
  toTop.classList.toggle("show", y > 600);
  let cur = "";
  document.querySelectorAll("section[id]").forEach(s=>{ if(y + 140 >= s.offsetTop) cur = s.id; });
  links.forEach(a=>a.classList.toggle("active", a.getAttribute("href") === "#" + cur));
},{passive:true});

// reveal + counters
const fmt = n => (root.lang === "en" ? String(n) : n.toLocaleString("ar-EG"));
function runCount(el){
  const end = +el.dataset.count, suf = el.dataset.suffix || ""; let t0 = null;
  const step = ts => { t0 ??= ts; const p = Math.min((ts - t0)/1200, 1); el.textContent = fmt(Math.round(end * (1 - Math.pow(1-p,3)))) + suf; if(p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  e.target.classList.add("in");
  e.target.querySelectorAll("[data-count]").forEach(runCount);
  io.unobserve(e.target);
}),{threshold:.15});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>document.querySelectorAll("[data-count]").forEach(el=>{ el.textContent = fmt(+el.dataset.count) + (el.dataset.suffix||""); })));
document.getElementById("yr").textContent = new Date().getFullYear();
